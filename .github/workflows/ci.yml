name: AEGIS-Traffic CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Formatting, Linting & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Formatting with Black
        run: |
          black --check app dashboard

      - name: Check Import Sorting with isort
        run: |
          isort --check-only app dashboard

      - name: Lint Code with Flake8
        run: |
          flake8 app dashboard --max-line-length=160 --extend-ignore=E203,W503,F401,E501

      - name: Run Pytest & Generate Coverage Report
        run: |
          python -m pytest app/tests/ --cov=app --cov-report=xml --cov-report=term-missing

  docker-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t aegis-backend:latest -f Dockerfile.backend .

      - name: Build Frontend Docker Image
        run: |
          docker build -t aegis-frontend:latest -f Dockerfile.frontend .
